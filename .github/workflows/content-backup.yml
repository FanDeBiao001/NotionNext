name: Content backup
on:
  workflow_dispatch:
  schedule:
    - cron: '23 19 * * *'
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Export and verify public content
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          BACKUP_SITE_URL: ${{ vars.BACKUP_SITE_URL }}
        run: |
          if [ -z "$BACKUP_SITE_URL" ] || [ -z "$ADMIN_API_TOKEN" ]; then
            echo 'Set BACKUP_SITE_URL and ADMIN_API_TOKEN to enable scheduled backups.'
            exit 0
          fi
          node scripts/content-ops.js backup "$BACKUP_SITE_URL" notionnext-backup.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-content-backup
          path: notionnext-backup.json
          if-no-files-found: ignore
          retention-days: 30
