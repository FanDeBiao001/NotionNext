<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- 3D 像素箭头 - 顶面高光 -->
  <rect x="2" y="2" width="4" height="4" fill="#a5b4fc"/>
  <rect x="2" y="6" width="4" height="4" fill="#a5b4fc"/>
  <rect x="6" y="6" width="4" height="4" fill="#a5b4fc"/>

  <!-- 斜面 -->
  <rect x="6" y="10" width="4" height="4" fill="#818cf8"/>
  <rect x="10" y="10" width="4" height="4" fill="#4338ca"/>
  <rect x="10" y="14" width="4" height="4" fill="#818cf8"/>
  <rect x="14" y="14" width="4" height="4" fill="#4338ca"/>
  <rect x="14" y="18" width="4" height="4" fill="#818cf8"/>
  <rect x="18" y="18" width="4" height="4" fill="#4338ca"/>

  <!-- 箭杆 -->
  <rect x="6" y="22" width="4" height="4" fill="#818cf8"/>
  <rect x="10" y="22" width="4" height="4" fill="#4338ca"/>
  <rect x="10" y="26" width="4" height="4" fill="#818cf8"/>
  <rect x="14" y="26" width="4" height="4" fill="#4338ca"/>

  <!-- 底部边缘阴影 -->
  <rect x="14" y="22" width="4" height="4" fill="#3730a3"/>
  <rect x="18" y="22" width="4" height="4" fill="#312e81"/>

  <!-- Hover 状态 - 高亮描边 -->
  <rect x="0" y="0" width="4" height="4" fill="#c7d2fe"/>
  <rect x="4" y="0" width="4" height="4" fill="#c7d2fe"/>
  <rect x="0" y="4" width="4" height="4" fill="#c7d2fe"/>
</svg>
